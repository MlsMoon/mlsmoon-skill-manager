name: CI

on:
  push:
    branches: [develop, release]
  pull_request:
    branches: [develop, release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package portable EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test and publish
        shell: pwsh
        run: ./Scripts/build.ps1

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: MlsmoonSkillManager-portable
          path: |
            dist/MlsmoonSkillManager.exe
            dist/app/catalog/**
          if-no-files-found: error
